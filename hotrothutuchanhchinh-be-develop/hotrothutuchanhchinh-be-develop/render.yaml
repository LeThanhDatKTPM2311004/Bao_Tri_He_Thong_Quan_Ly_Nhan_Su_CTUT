# Deploy backend: https://render.com → New Blueprint hoặc Web Service
# Hoặc import repo GitHub hotrothutuchanhchinh-be (nhánh develop)

services:
  - type: web
    name: hotrothutuchanhchinh-be
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_PORTAL_URL
        sync: false
      - key: STUDENT_PORTAL_URL
        sync: false
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Render free tier chặn cổng SMTP 25/465/587 → phải gửi mail qua HTTP API
      # Tạo API key miễn phí tại https://app.brevo.com (Settings → SMTP & API → API Keys)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
