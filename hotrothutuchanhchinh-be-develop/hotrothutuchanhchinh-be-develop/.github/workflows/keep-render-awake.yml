name: Keep Render awake

# Runs on default branch (main). Pings BE so free-tier Render does not sleep.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake backend health endpoint
        run: |
          set +e
          URL="https://hotrothutuchanhchinh-be.onrender.com/api/v1/health"
          echo "Pinging $URL"
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then
              echo ""
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "All attempts failed (Render may still be cold); workflow exits OK."
          exit 0
