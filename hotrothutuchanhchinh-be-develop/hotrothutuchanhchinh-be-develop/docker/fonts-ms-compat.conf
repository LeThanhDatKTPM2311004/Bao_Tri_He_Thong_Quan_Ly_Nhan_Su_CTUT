<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Map common Windows document fonts to Liberation (metrics-compatible). -->
  <!-- Times New Roman khi đã cài; không có thì Liberation Serif (cùng bề rộng chữ). -->
  <alias>
    <family>Times New Roman</family>
    <prefer>
      <family>Times New Roman</family>
    </prefer>
    <default>
      <family>Liberation Serif</family>
    </default>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer>
      <family>Liberation Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer>
      <family>Liberation Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer>
      <family>Liberation Mono</family>
    </prefer>
  </alias>
</fontconfig>
